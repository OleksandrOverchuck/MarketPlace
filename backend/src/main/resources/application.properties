spring.application.name=jollycart

spring.datasource.url=jdbc:mysql://localhost:3306/jollycart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Warsaw
spring.datasource.username=JollyCart_User
spring.datasource.password=${CON_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.security.oauth2.client.registration.google.client-id=529987822035-r69u35gj9m6lfdokqc0f4tkoe8uc87cq.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.org.springframework.security=DEBUG

# --- Wysyłka maili (kod weryfikacyjny przy rejestracji) ---
# Konto, z którego APLIKACJA wysyła maile (np. jollycart.app@gmail.com).
# MAIL_PASSWORD to "hasło do aplikacji" Google (nie zwykłe hasło do konta).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME}
app.verification.code-length=6

# Adres frontendu - używany w linkach z maili o nowych wiadomościach
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5501}
